name: CI

on:
  push:
    # beta collects changes for testing; each run uploads its debug APK, see below.
    branches: [main, beta]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      # Also validates gradle-wrapper.jar against the known Gradle checksums.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Release is built unsigned here, so R8 and resource shrinking are checked on every push.
      - run: ./gradlew --no-daemon lintDebug assembleDebug assembleRelease

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

      # Named after version and commit, so downloads from different runs can be told apart.
      - name: Name the debug APK
        id: apk
        run: |
          version="$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)"
          apk="alexa-icon-hider-${version}-${GITHUB_SHA::7}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      # Not zipped, so the download is the APK itself; the artifact takes the file's name.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.apk.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 14
