name: Release

# Push a tag like v1.5 that matches versionName in app/build.gradle.kts. The workflow builds the
# signed APK, checks it is signed with the published key, attests it and creates the GitHub release.
# A tag like v1.5-beta.1 creates a prerelease.
on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Fingerprint of the signing certificate (CN=minnallab), as in README.md. Updates only install
  # over an existing app when the key matches, so a release with any other key must not go out.
  EXPECTED_CERT_SHA256: 24b85f093c4ddda288d8be50cd7484a7cbc04477fcfc2cd4db19a2ab5f21d33e

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Holds the signing secrets. Add required reviewers to this environment to gate releases.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag, versionName and changelog
        id: version
        run: |
          version="$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match versionName ${version}"
            exit 1
          fi
          # Notes are the changelog section for this version. A SHA-256 line in it is dropped,
          # the checksum of the APK built here is appended instead.
          awk -v v="$version" '
            /^## / { if (found) exit; found = ($2 == v) ; next }
            found && !/^SHA-256 /
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section '## ${version} ...'"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      # No cache for release builds, so nothing written by another run ends up in the APK.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Decode keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Secret SIGNING_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Verify signature and rename
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          apk="alexa-icon-hider-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          certs="$("$apksigner" verify --verbose --print-certs "$apk")"
          echo "$certs"
          # Older apksigner prints "Signer #1 certificate ...", newer ones one line per scheme
          # ("V2 Signer: certificate ..."). Exactly one signer, and every line must name the same key.
          if ! echo "$certs" | grep -qx 'Number of signers: 1'; then
            echo "::error::APK must have exactly one signer"
            exit 1
          fi
          actual="$(echo "$certs" | sed -nE 's/^(Signer #1|V[0-9.]+ Signer:) certificate SHA-256 digest: //p' | sort -u)"
          if [ "$actual" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK is signed with ${actual:-no key}, expected ${EXPECTED_CERT_SHA256}"
            exit 1
          fi
          sha256sum "$apk" > "$apk.sha256"
          sha="$(cut -d ' ' -f 1 "$apk.sha256")"
          printf '\nSHA-256 von `%s`: `%s`\n' "$apk" "$sha" >> "$RUNNER_TEMP/notes.md"
          echo "file=${apk}" >> "$GITHUB_OUTPUT"
          echo "| APK | SHA-256 | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`${apk}\` | \`${sha}\` | $(stat -c %s "$apk") bytes |" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.apk.outputs.file }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.file }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # A version with a suffix (1.5-beta.1, 1.6-rc.1) is a prerelease and never becomes "Latest".
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${prerelease[@]}"
